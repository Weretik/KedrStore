name: Deploy to Cloud Run

on:
  push:
    branches: [ "master" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: classkedrproject
  GCP_REGION: europe-central2
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/449981321140/locations/global/workloadIdentityPools/github/providers/github-oidc
  GCP_DEPLOY_SERVICE_ACCOUNT: gha-deployer@classkedrproject.iam.gserviceaccount.com
  CLOUD_RUN_SERVICE: api

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check documentation links
        run: python3 tools/docs/check_doc_links.py

      - name: Test the test selection
        run: python3 -m unittest discover -s tools/ci

      # A pull request runs only the tests of the changed modules and of the modules that reference them;
      # shared code, hosts and build files run everything. A push to master always runs everything.
      - name: Select affected tests
        id: affected
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/ci/affected_tests.py "origin/${{ github.base_ref }}"
          else
            echo "scope=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore KedrStore.sln

      - name: Build
        run: dotnet build KedrStore.sln --no-restore --configuration Release

      - name: Run unit tests with coverage
        if: steps.affected.outputs.scope != 'none'
        env:
          TEST_FILTER: ${{ steps.affected.outputs.unit_filter }}
        run: dotnet test tests/UnitTests/UnitTests.csproj --no-build --configuration Release ${TEST_FILTER:+--filter "$TEST_FILTER"} --collect:"XPlat Code Coverage" --results-directory artifacts/test-results/unit

      - name: Run architecture tests with coverage
        run: dotnet test tests/ArchitectureTests/ArchitectureTests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory artifacts/test-results/architecture

      - name: Run integration and PostgreSQL tests with coverage
        if: steps.affected.outputs.scope != 'none'
        env:
          TEST_FILTER: ${{ steps.affected.outputs.integration_filter }}
        run: dotnet test tests/IntegrationTests/IntegrationTests.csproj --no-build --configuration Release ${TEST_FILTER:+--filter "$TEST_FILTER"} --collect:"XPlat Code Coverage" --results-directory artifacts/test-results/integration

      - name: Upload coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-${{ github.sha }}
          path: artifacts/test-results/**/coverage.cobertura.xml
          if-no-files-found: warn

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v3
        # Keyless sign-in (Workload Identity Federation): no long-lived service account key in GitHub.
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Validate deploy environment
        run: |
          test -n "${{ env.GCP_PROJECT_ID }}" || (echo "GCP_PROJECT_ID is empty" && exit 1)
          test -n "${{ env.GCP_REGION }}" || (echo "GCP_REGION is empty" && exit 1)
          test -n "${{ env.CLOUD_RUN_SERVICE }}" || (echo "CLOUD_RUN_SERVICE is empty" && exit 1)

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Host.Api image
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/api/api:${{ github.sha }}"
          docker build -f src/Bootstrapper/Host.Api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Build & Push Host.Jobs image
        run: |
          JOBS_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/api/host-jobs:${{ github.sha }}"
          docker build -f src/Bootstrapper/Host.Jobs/Dockerfile -t "$JOBS_IMAGE" .
          docker push "$JOBS_IMAGE"
          echo "JOBS_IMAGE=$JOBS_IMAGE" >> $GITHUB_ENV

      - name: Run database migrations
        run: |
          MIGRATION_JOB="database-migrate"
          MIGRATION_SECRETS="ConnectionStrings__Default=db-connection:latest,ADMIN_DEFAULT_PASSWORD=identity-admin-password:latest"

          if gcloud run jobs describe "$MIGRATION_JOB" --region "${{ env.GCP_REGION }}" >/dev/null 2>&1; then
            gcloud run jobs update "$MIGRATION_JOB" \
              --image "${{ env.JOBS_IMAGE }}" \
              --region "${{ env.GCP_REGION }}" \
              --tasks 1 \
              --parallelism 1 \
              --max-retries 0 \
              --task-timeout 30m \
              --args=--job=migrate \
              --set-secrets "$MIGRATION_SECRETS" \
              --quiet
          else
            gcloud run jobs create "$MIGRATION_JOB" \
              --image "${{ env.JOBS_IMAGE }}" \
              --region "${{ env.GCP_REGION }}" \
              --tasks 1 \
              --parallelism 1 \
              --max-retries 0 \
              --task-timeout 30m \
              --args=--job=migrate \
              --set-secrets "$MIGRATION_SECRETS" \
              --quiet
          fi

          gcloud run jobs execute "$MIGRATION_JOB" \
            --region "${{ env.GCP_REGION }}" \
            --wait \
            --quiet

      - name: Deploy Host.Api to Cloud Run
        run: |
          API_SECRETS="ConnectionStrings__Default=db-connection:latest,OneCSoap__Endpoint=onec-endpoint:latest,OneCSoap__Username=onec-username:latest,OneCSoap__Password=onec-password:latest,ADMIN_DEFAULT_PASSWORD=identity-admin-password:latest,Telegram__BotToken=telegram-bot-token:latest,Telegram__ChatId=telegram-chat-id:latest,TrustedProxy__SharedSecret=api-proxy-shared-secret:latest,AvatarStorage__Ftp__Password=cdn-avatars-ftp-password:latest,MediaStorage__Ftp__Password=cdn-media-ftp-password:latest"

          # «Оновити сайт зараз» works once both site secrets exist; until then the admin says the site is not connected.
          if gcloud secrets describe site-revalidate-url >/dev/null 2>&1 \
            && gcloud secrets describe site-revalidate-secret >/dev/null 2>&1; then
            API_SECRETS="${API_SECRETS},SiteRevalidation__Url=site-revalidate-url:latest,SiteRevalidation__Secret=site-revalidate-secret:latest"
          fi

          gcloud run deploy "${{ env.CLOUD_RUN_SERVICE }}" \
            --image "${{ env.IMAGE }}" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --set-secrets "$API_SECRETS" \
            --quiet

      - name: Update Cloud Run Jobs to new image
        run: |
          for JOB in onec-prices onec-category onec-pricetypes onec-productdetails onec-stocks onec-full; do
            gcloud run jobs update "$JOB" \
              --image "${{ env.JOBS_IMAGE }}" \
              --region "${{ env.GCP_REGION }}" \
              --quiet
          done

          JOB_SECRETS="ConnectionStrings__Default=db-connection:latest,OneCSoap__Endpoint=onec-endpoint:latest,OneCSoap__Username=onec-username:latest,OneCSoap__Password=onec-password:latest"

          ORDER_SYNC_JOB="onec-orders-sync"
          ORDER_SYNC_ARGS="--job=sync-one-c-orders"
          ORDER_SYNC_SECRETS="${JOB_SECRETS},Telegram__BotToken=telegram-bot-token:latest,Telegram__ChatId=telegram-chat-id:latest"

          if gcloud run jobs describe "$ORDER_SYNC_JOB" --region "${{ env.GCP_REGION }}" >/dev/null 2>&1; then
            gcloud run jobs update "$ORDER_SYNC_JOB" \
              --image "${{ env.JOBS_IMAGE }}" \
              --region "${{ env.GCP_REGION }}" \
              --tasks 1 \
              --parallelism 1 \
              --max-retries 0 \
              --task-timeout 10m \
              --args="$ORDER_SYNC_ARGS" \
              --set-secrets "$ORDER_SYNC_SECRETS" \
              --quiet
          else
            gcloud run jobs create "$ORDER_SYNC_JOB" \
              --image "${{ env.JOBS_IMAGE }}" \
              --region "${{ env.GCP_REGION }}" \
              --tasks 1 \
              --parallelism 1 \
              --max-retries 0 \
              --task-timeout 10m \
              --args="$ORDER_SYNC_ARGS" \
              --set-secrets "$ORDER_SYNC_SECRETS" \
              --quiet
          fi

          # Registers CDN files in the media library; run it once with --dry-run, then without (see the media runbook).
          MEDIA_SYNC_JOB="media-cdn-sync"
          MEDIA_SYNC_SECRETS="ConnectionStrings__Default=db-connection:latest,MediaStorage__Ftp__Password=cdn-media-ftp-password:latest"

          if gcloud run jobs describe "$MEDIA_SYNC_JOB" --region "${{ env.GCP_REGION }}" >/dev/null 2>&1; then
            gcloud run jobs update "$MEDIA_SYNC_JOB" \
              --image "${{ env.JOBS_IMAGE }}" \
              --region "${{ env.GCP_REGION }}" \
              --set-secrets "$MEDIA_SYNC_SECRETS" \
              --quiet
          else
            gcloud run jobs create "$MEDIA_SYNC_JOB" \
              --image "${{ env.JOBS_IMAGE }}" \
              --region "${{ env.GCP_REGION }}" \
              --tasks 1 \
              --parallelism 1 \
              --max-retries 0 \
              --task-timeout 60m \
              --args=--job=media-cdn-sync \
              --set-secrets "$MEDIA_SYNC_SECRETS" \
              --quiet
          fi

          # Catalog attributes (spec catalog/006): the CSV import and the .NET recognizer over current 1C names.
          # Each dry-run job only reports changes; each apply job writes them. All are idempotent and run only by hand.
          ATTRIBUTE_SECRETS="ConnectionStrings__Default=db-connection:latest"
          for JOB_DEF in \
            "catalog-attributes-import-dry-run|--job=import-catalog-attributes" \
            "catalog-attributes-import-apply|--job=import-catalog-attributes,--apply" \
            "catalog-attributes-recognize-dry-run|--job=recognize-catalog-attributes" \
            "catalog-attributes-recognize-apply|--job=recognize-catalog-attributes,--apply"
          do
            IFS='|' read -r JOB_NAME JOB_ARG <<< "$JOB_DEF"

            if gcloud run jobs describe "$JOB_NAME" --region "${{ env.GCP_REGION }}" >/dev/null 2>&1; then
              gcloud run jobs update "$JOB_NAME" \
                --image "${{ env.JOBS_IMAGE }}" \
                --region "${{ env.GCP_REGION }}" \
                --args="$JOB_ARG" \
                --set-secrets "$ATTRIBUTE_SECRETS" \
                --quiet
            else
              gcloud run jobs create "$JOB_NAME" \
                --image "${{ env.JOBS_IMAGE }}" \
                --region "${{ env.GCP_REGION }}" \
                --tasks 1 \
                --parallelism 1 \
                --max-retries 0 \
                --task-timeout 30m \
                --args="$JOB_ARG" \
                --set-secrets "$ATTRIBUTE_SECRETS" \
                --quiet
            fi
          done

          # Primary customer-sync job. This is the only customer job that should be used for routine execution.
          for JOB_DEF in \
            "onec-sales-customers-full|--job=sales-customers-full"
          do
            IFS='|' read -r JOB_NAME JOB_ARG <<< "$JOB_DEF"

            if gcloud run jobs describe "$JOB_NAME" --region "${{ env.GCP_REGION }}" >/dev/null 2>&1; then
              gcloud run jobs update "$JOB_NAME" \
                --image "${{ env.JOBS_IMAGE }}" \
                --region "${{ env.GCP_REGION }}" \
                --args="$JOB_ARG" \
                --set-secrets "$JOB_SECRETS" \
                --quiet
            else
              gcloud run jobs create "$JOB_NAME" \
                --image "${{ env.JOBS_IMAGE }}" \
                --region "${{ env.GCP_REGION }}" \
                --tasks 1 \
                --parallelism 1 \
                --max-retries 1 \
                --args="$JOB_ARG" \
                --set-secrets "$JOB_SECRETS" \
                --quiet
            fi
          done

          # Manual fallback jobs for diagnostics or one-off recovery. Keep them updated if they already exist,
          # but do not auto-create them to avoid encouraging split execution instead of the composite job.
          for JOB_DEF in \
            "onec-counterparties|--job=counterparties" \
            "onec-counterparty-category-price-types|--job=counterparty-category-price-types"
          do
            IFS='|' read -r JOB_NAME JOB_ARG <<< "$JOB_DEF"

            if gcloud run jobs describe "$JOB_NAME" --region "${{ env.GCP_REGION }}" >/dev/null 2>&1; then
              gcloud run jobs update "$JOB_NAME" \
                --image "${{ env.JOBS_IMAGE }}" \
                --region "${{ env.GCP_REGION }}" \
                --args="$JOB_ARG" \
                --set-secrets "$JOB_SECRETS" \
                --quiet
            fi
          done

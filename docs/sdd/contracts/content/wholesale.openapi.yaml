openapi: 3.1.0
info:
  title: KedrStore Content — page «Співпраця»
  version: 0.1.0
  description: >-
    The editable copy of the site page «Співпраця» (wholesale offer), block by block from the top: hero with its
    contact card, assortment, company, three order steps, questions, closing call. Plain text without HTML. Buttons,
    links, category cards and contact values are not here: the site keeps them or reads the company contacts.
paths:
  /api/content/{lang}/wholesale:
    get:
      operationId: getPublicWholesalePage
      summary: Get the page texts in one language
      description: Public, because the site renders the page for anonymous visitors.
      tags: [Wholesale]
      security: []
      parameters:
        - name: lang
          in: path
          required: true
          schema: { type: string, enum: [uk, ru] }
      responses:
        '200':
          description: The texts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicWholesalePage' }
        '400': { description: '`lang` is not `uk` or `ru`.' }
        '404': { description: The page row is missing (it is created by a migration). }
  /api/admin/content/wholesale:
    get:
      operationId: getAdminWholesalePage
      summary: Get both languages for editing
      description: Requires `CanManageContent` (Manager or Admin).
      tags: [Wholesale]
      responses:
        '200':
          description: Both texts, `uk` first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminWholesalePage' }
        '401': { description: Not signed in. }
        '403': { description: Not a Manager or Admin. }
        '404': { description: The page row is missing. }
    put:
      operationId: updateAdminWholesalePage
      summary: Replace both languages at once
      description: Requires `CanManageContent` (Manager or Admin). Every text is required. Repeating it is safe.
      tags: [Wholesale]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveWholesalePageRequest' }
      responses:
        '200':
          description: The saved page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminWholesalePage' }
        '400':
          description: Invalid input; errors name the field (`texts`, `texts[0].HeroTitle`, `texts[1].Steps`…).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Not signed in. }
        '403': { description: Not a Manager or Admin. }
        '404': { description: The page row is missing. }
components:
  schemas:
    WholesaleStep:
      type: object
      required: [title, text]
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        text: { type: string, minLength: 1, maxLength: 200 }
    WholesaleFaqItem:
      type: object
      required: [question, answer]
      properties:
        question: { type: string, minLength: 1, maxLength: 200 }
        answer: { type: string, minLength: 1, maxLength: 1000 }
    WholesaleText:
      type: object
      required:
        - language
        - heroTitle
        - heroLead
        - contactCardTitle
        - contactCardNote
        - assortmentTitle
        - assortmentIntro
        - companyTitle
        - companyText
        - selectionTitle
        - selectionText
        - warehouseTitle
        - warehouseText
        - stepsTitle
        - steps
        - faqTitle
        - faq
        - closingTitle
      properties:
        language: { type: string, enum: [uk, ru] }
        heroTitle: { type: string, minLength: 1, maxLength: 120 }
        heroLead: { type: string, minLength: 1, maxLength: 600 }
        contactCardTitle: { type: string, minLength: 1, maxLength: 80 }
        contactCardNote: { type: string, minLength: 1, maxLength: 200 }
        assortmentTitle: { type: string, minLength: 1, maxLength: 120 }
        assortmentIntro: { type: string, minLength: 1, maxLength: 200 }
        companyTitle:
          type: string
          minLength: 1
          maxLength: 120
          description: Shown after the company name («Class Kedr — …»), so it may start in lower case.
        companyText: { type: string, minLength: 1, maxLength: 600 }
        selectionTitle: { type: string, minLength: 1, maxLength: 80 }
        selectionText: { type: string, minLength: 1, maxLength: 200 }
        warehouseTitle: { type: string, minLength: 1, maxLength: 80 }
        warehouseText: { type: string, minLength: 1, maxLength: 200 }
        stepsTitle: { type: string, minLength: 1, maxLength: 120 }
        steps:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: '#/components/schemas/WholesaleStep' }
        faqTitle: { type: string, minLength: 1, maxLength: 120 }
        faq:
          type: array
          minItems: 1
          maxItems: 12
          items: { $ref: '#/components/schemas/WholesaleFaqItem' }
        closingTitle: { type: string, minLength: 1, maxLength: 120 }
    PublicWholesalePage:
      type: object
      required: [text, updatedAt]
      properties:
        text: { $ref: '#/components/schemas/WholesaleText' }
        updatedAt: { type: string, format: date-time }
    AdminWholesalePage:
      type: object
      required: [texts, updatedAt, updatedBy]
      properties:
        texts:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/WholesaleText' }
        updatedAt: { type: string, format: date-time }
        updatedBy:
          type: [string, 'null']
          maxLength: 256
          description: Email (else user name) of who saved last; null for the row created by the migration.
    SaveWholesalePageRequest:
      type: object
      required: [texts]
      properties:
        texts:
          type: array
          description: Exactly one `uk` and one `ru` text.
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/WholesaleText' }

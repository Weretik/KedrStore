openapi: 3.1.0
info:
  title: KedrStore Content — site gallery
  version: 0.1.0
  description: >-
    The site gallery: photos picked from the media library (linked by file ID) and YouTube videos added by link,
    with optional titles and captions in Ukrainian and Russian, shown in the order the admin sets. Every admin
    change answers with the whole gallery, so the page needs no second request.
paths:
  /api/content/{lang}/gallery:
    get:
      operationId: getPublicGallery
      summary: Get the site gallery in one language
      description: >-
        Public, in site order. A video's `imageUrl` is YouTube's poster (480×360); a photo's is its CDN URL, with
        `width`/`height` when the library knows them. A photo whose library file was deleted is left out.
      tags: [Gallery]
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: The gallery cards.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicGalleryItem' }
        '400': { description: The language is not `uk` or `ru`. }
  /api/admin/content/gallery:
    get:
      operationId: getAdminGallery
      summary: List the gallery cards with previews
      description: Requires `CanManageContent` (Manager, Seo, or Admin).
      tags: [Gallery]
      responses:
        '200': { $ref: '#/components/responses/Gallery' }
        '401': { description: Not signed in. }
        '403': { description: 'Not a Manager, Seo, or Admin.' }
  /api/admin/content/gallery/photos:
    post:
      operationId: addAdminGalleryPhotos
      summary: Add media-library photos to the end of the gallery
      description: >-
        Requires `CanManageContent`. Up to 100 file IDs in the order to add; a photo already in the gallery is
        skipped. A file that is not in the library answers 400 and nothing is added.
      tags: [Gallery]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddGalleryPhotosRequest' }
      responses:
        '200': { $ref: '#/components/responses/Gallery' }
        '400': { description: 'No IDs, more than 100, or a file that is not in the media library.' }
        '401': { description: Not signed in. }
        '403': { description: 'Not a Manager, Seo, or Admin.' }
  /api/admin/content/gallery/videos:
    post:
      operationId: addAdminGalleryVideo
      summary: Add a YouTube video by its link to the end of the gallery
      description: >-
        Requires `CanManageContent`. `url` may be a watch, youtu.be, shorts, embed or live link, or the bare
        11-character ID.
      tags: [Gallery]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddGalleryVideoRequest' }
      responses:
        '200': { $ref: '#/components/responses/Gallery' }
        '400': { description: 'Not a YouTube video link, or a text over its limit.' }
        '401': { description: Not signed in. }
        '403': { description: 'Not a Manager, Seo, or Admin.' }
        '409': { description: The video is already in the gallery. }
  /api/admin/content/gallery/youtube-preview:
    get:
      operationId: previewAdminGalleryYoutubeVideo
      summary: Resolve a pasted YouTube link before adding it
      description: >-
        Requires `CanManageContent`. `title` is what YouTube's public oEmbed gives, or `null` when it does not
        answer (private or deleted video, network error).
      tags: [Gallery]
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The video ID, poster and title.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YoutubePreview' }
        '400': { description: Not a YouTube video link. }
        '401': { description: Not signed in. }
        '403': { description: 'Not a Manager, Seo, or Admin.' }
  /api/admin/content/gallery/items/{id}:
    put:
      operationId: updateAdminGalleryItem
      summary: Replace the title and caption of a card
      description: Requires `CanManageContent`. Empty or missing values are stored as none.
      tags: [Gallery]
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GalleryTexts' }
      responses:
        '200': { $ref: '#/components/responses/Gallery' }
        '400': { description: A text over its limit. }
        '401': { description: Not signed in. }
        '403': { description: 'Not a Manager, Seo, or Admin.' }
        '404': { description: No such card. }
    delete:
      operationId: deleteAdminGalleryItem
      summary: Remove a card from the gallery
      description: Requires `CanManageContent`. The picture stays in the media library.
      tags: [Gallery]
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200': { $ref: '#/components/responses/Gallery' }
        '401': { description: Not signed in. }
        '403': { description: 'Not a Manager, Seo, or Admin.' }
        '404': { description: No such card. }
  /api/admin/content/gallery/order:
    put:
      operationId: reorderAdminGallery
      summary: Save the order of all cards
      description: >-
        Requires `CanManageContent`. `ids` must hold every current card exactly once, first shown first; a list
        built from a stale page answers 409.
      tags: [Gallery]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderGalleryRequest' }
      responses:
        '200': { $ref: '#/components/responses/Gallery' }
        '400': { description: A repeated or invalid ID. }
        '401': { description: Not signed in. }
        '403': { description: 'Not a Manager, Seo, or Admin.' }
        '409': { description: The list does not match the current gallery. }
components:
  parameters:
    Lang:
      name: lang
      in: path
      required: true
      schema: { type: string, enum: [uk, ru] }
    ItemId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    Gallery:
      description: The whole gallery in site order.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/AdminGalleryItem' }
  schemas:
    GalleryItemKind:
      type: string
      enum: [photo, video]
    PublicGalleryItem:
      type: object
      required: [id, kind, title, caption, imageUrl, width, height, youtubeId]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: '#/components/schemas/GalleryItemKind' }
        title: { type: [string, 'null'] }
        caption: { type: [string, 'null'] }
        imageUrl: { type: string, format: uri }
        width: { type: [integer, 'null'], format: int32 }
        height: { type: [integer, 'null'], format: int32 }
        youtubeId: { type: [string, 'null'], description: Set only for a video. }
    AdminGalleryItem:
      type: object
      required:
        [id, kind, mediaFileId, youtubeId, position, titleUk, titleRu, captionUk, captionRu, previewUrl, fileName, fileMissing, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: '#/components/schemas/GalleryItemKind' }
        mediaFileId: { type: [integer, 'null'], format: int64, description: Set only for a photo. }
        youtubeId: { type: [string, 'null'], description: Set only for a video. }
        position: { type: integer, format: int32 }
        titleUk: { type: [string, 'null'], maxLength: 150 }
        titleRu: { type: [string, 'null'], maxLength: 150 }
        captionUk: { type: [string, 'null'], maxLength: 500 }
        captionRu: { type: [string, 'null'], maxLength: 500 }
        previewUrl: { type: [string, 'null'], description: 'Poster or CDN URL; null for a photo whose file is gone.' }
        fileName: { type: [string, 'null'], description: Library file name of a photo. }
        fileMissing: { type: boolean, description: A photo whose library file was deleted; the site hides it. }
        updatedAt: { type: string, format: date-time }
    GalleryTexts:
      type: object
      properties:
        titleUk: { type: [string, 'null'], maxLength: 150 }
        titleRu: { type: [string, 'null'], maxLength: 150 }
        captionUk: { type: [string, 'null'], maxLength: 500 }
        captionRu: { type: [string, 'null'], maxLength: 500 }
    AddGalleryPhotosRequest:
      type: object
      required: [mediaFileIds]
      properties:
        mediaFileIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: integer, format: int64 }
    AddGalleryVideoRequest:
      allOf:
        - $ref: '#/components/schemas/GalleryTexts'
        - type: object
          required: [url]
          properties:
            url: { type: string, description: 'A YouTube link or the bare 11-character video ID.' }
    ReorderGalleryRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: integer, format: int64 }
    YoutubePreview:
      type: object
      required: [youtubeId, title, thumbnailUrl, alreadyInGallery]
      properties:
        youtubeId: { type: string }
        title: { type: [string, 'null'] }
        thumbnailUrl: { type: string, format: uri }
        alreadyInGallery: { type: boolean }

openapi: 3.1.0
info:
  title: KedrStore Content — site articles
  version: 0.3.0
  description: >-
    Public reads of published site articles and their covers, and Manager/Admin management of articles.
    A cover is a media-library picture on the CDN (`coverUrl`, CDN folder `articles`). Covers saved before
    Content 008 are still served by the API (`coverPath`, relative to the API base URL, with a version in `v`)
    until they are replaced. Clients use `coverUrl`, else `coverPath`.
paths:
  /api/content/{lang}/articles:
    get:
      operationId: getArticles
      summary: List published articles in one language, newest first
      description: Public, because the site renders articles for anonymous visitors.
      tags: [Articles]
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Published articles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ArticleSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/content/{lang}/articles/{slug}:
    get:
      operationId: getArticle
      summary: Get one published article by slug
      tags: [Articles]
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        '200':
          description: The article.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Article' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: No published article with this slug. }
  /api/content/articles/{id}/cover:
    get:
      operationId: getArticleCover
      summary: Get the cover picture of an article
      description: >-
        Public. Drafts are included so the admin preview works; the path is only known from an article response.
        With `v` equal to the current cover version the response is `Cache-Control: public, max-age=31536000, immutable`.
      tags: [Articles]
      security: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
        - name: v
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: WebP picture.
          content:
            image/webp:
              schema: { type: string, format: binary }
        '404': { description: The article or its cover does not exist. }
  /api/admin/articles:
    get:
      operationId: getAdminArticles
      summary: List all articles, drafts included, newest first
      tags: [Admin articles]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Articles with Ukrainian titles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminArticleSummary' }
        '401': { description: Not signed in. }
        '403': { description: 'Signed in without the Manager, Seo, or Admin role.' }
    post:
      operationId: createAdminArticle
      summary: Create an article
      description: >-
        An empty `slug` is generated from the Ukrainian title (KMU-2010 transliteration, `-2`, `-3`… on a clash).
        `bodyHtml` is sanitized to p, br, strong, em, ul, ol, li, h2, h3, blockquote, and a[href] (http, https, or a
        path starting with `/`). Not idempotent: repeating the request creates another article.
      tags: [Admin articles]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveArticleRequest' }
      responses:
        '200':
          description: The created article as stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminArticle' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Not signed in. }
        '403': { description: 'Signed in without the Manager, Seo, or Admin role.' }
  /api/admin/articles/{id}:
    get:
      operationId: getAdminArticle
      summary: Get an article with both languages
      tags: [Admin articles]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: The article.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminArticle' }
        '401': { description: Not signed in. }
        '403': { description: 'Signed in without the Manager, Seo, or Admin role.' }
        '404': { description: Article not found. }
    put:
      operationId: updateAdminArticle
      summary: Replace an article's slug, date, publication flag, and both texts
      description: Full replacement; `slug` is required and must not belong to another article. Repeating it is safe.
      tags: [Admin articles]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveArticleRequest' }
      responses:
        '200':
          description: The article as stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminArticle' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Not signed in. }
        '403': { description: 'Signed in without the Manager, Seo, or Admin role.' }
        '404': { description: Article not found. }
    delete:
      operationId: deleteAdminArticle
      summary: Delete an article and its cover for good
      description: To hide an article from the site without losing it, save it with `isPublished = false`.
      tags: [Admin articles]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '204': { description: Deleted. }
        '401': { description: Not signed in. }
        '403': { description: 'Signed in without the Manager, Seo, or Admin role.' }
        '404': { description: Article not found. }
  /api/admin/articles/covers:
    post:
      operationId: uploadAdminArticleCover
      summary: Upload a cover picture before saving the article
      description: >-
        JPEG, PNG, or WebP up to 10 MB, at least 600 px wide. Stored as WebP at most 1600 px wide with the EXIF
        orientation applied, on the CDN under `articles/` and in the media library folder «Статті» (created when
        missing). Nothing about an article changes: send `mediaFileId` as `coverMediaFileId` with the create or update.
      tags: [Admin articles]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: The picture in the media library.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleCoverUpload' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Not signed in. }
        '403': { description: 'Signed in without the Manager, Seo, or Admin role.' }
        '413': { description: The request is larger than the upload limit. }
        '503': { description: The CDN is not configured. }
  /api/admin/articles/covers/move-legacy:
    post:
      operationId: moveLegacyAdminArticleCovers
      summary: Move covers saved before Content 008 to the CDN
      description: >-
        Uploads each legacy cover to the CDN under `articles/` (library folder «Статті», named after the slug), sets it
        as the article cover, and deletes the stored bytes. Safe to repeat: a second call moves nothing. Stops at the
        first failed upload and keeps what was already moved.
      tags: [Admin articles]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: How many covers this call moved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyArticleCoversMoved' }
        '401': { description: Not signed in. }
        '403': { description: 'Signed in without the Manager, Seo, or Admin role.' }
        '503': { description: The CDN is not configured. }
components:
  parameters:
    Lang:
      name: lang
      in: path
      required: true
      schema: { type: string, enum: [uk, ru] }
    ArticleId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  responses:
    ValidationError:
      description: Invalid input; each error names the field (`slug`, `texts`, `coverMediaFileId`, `file`…).
      content:
        application/problem+json:
          schema: { $ref: '../problem.openapi.yaml#/components/schemas/ValidationProblem' }
  schemas:
    CoverPath:
      type: [string, 'null']
      description: >-
        Path of a cover saved before Content 008, relative to the API base URL, with the version in `v`;
        null otherwise.
      examples: ['/api/content/articles/4/cover?v=1']
    CoverUrl:
      type: [string, 'null']
      format: uri
      description: Absolute CDN address of the cover; null without one or when its library file was deleted.
      examples: ['https://images-kedr.cdn.express/articles/5f1c2b7e9a.webp']
    ArticleCoverUpload:
      type: object
      required: [mediaFileId, url]
      properties:
        mediaFileId: { type: integer, format: int64 }
        url: { type: string, format: uri }
    LegacyArticleCoversMoved:
      type: object
      required: [moved]
      properties:
        moved: { type: integer, minimum: 0 }
    ArticleSummary:
      type: object
      required: [id, slug, title, excerpt, publishedOn, coverPath, coverUrl, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string, description: Short plain-text description for cards and meta description. }
        publishedOn: { type: string, format: date }
        coverPath: { $ref: '#/components/schemas/CoverPath' }
        coverUrl: { $ref: '#/components/schemas/CoverUrl' }
        updatedAt: { type: string, format: date-time }
    Article:
      allOf:
        - $ref: '#/components/schemas/ArticleSummary'
        - type: object
          required: [bodyHtml]
          properties:
            bodyHtml: { type: string, description: Sanitized HTML; safe to render as is. }
    EditorName:
      type: [string, 'null']
      maxLength: 256
      description: Email (else user name) of who saved the last change; null for articles saved before it was recorded.
    AdminArticleSummary:
      type: object
      required: [id, slug, title, publishedOn, isPublished, coverPath, coverUrl, updatedAt, updatedBy]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        title: { type: string, description: Ukrainian title. }
        publishedOn: { type: string, format: date }
        isPublished: { type: boolean }
        coverPath: { $ref: '#/components/schemas/CoverPath' }
        coverUrl: { $ref: '#/components/schemas/CoverUrl' }
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: '#/components/schemas/EditorName' }
    ArticleText:
      type: object
      required: [language, title, excerpt, bodyHtml]
      properties:
        language: { type: string, enum: [uk, ru] }
        title: { type: string, minLength: 1, maxLength: 200 }
        excerpt: { type: string, minLength: 1, maxLength: 300 }
        bodyHtml: { type: string, minLength: 1, maxLength: 50000 }
    AdminArticle:
      type: object
      required: [id, slug, publishedOn, isPublished, coverPath, coverUrl, coverMediaFileId, updatedAt, updatedBy, texts]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        publishedOn: { type: string, format: date }
        isPublished: { type: boolean }
        coverPath: { $ref: '#/components/schemas/CoverPath' }
        coverUrl: { $ref: '#/components/schemas/CoverUrl' }
        coverMediaFileId:
          type: [integer, 'null']
          format: int64
          description: Media library file of the cover; stays set when that file was deleted (then `coverUrl` is null).
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: '#/components/schemas/EditorName' }
        texts:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/ArticleText' }
    SaveArticleRequest:
      type: object
      required: [publishedOn, isPublished, texts]
      properties:
        slug:
          type: [string, 'null']
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 120
          description: Required on update; empty on create means "generate from the Ukrainian title".
        publishedOn: { type: string, format: date }
        isPublished: { type: boolean }
        coverMediaFileId:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: >-
            Sets the cover: a file from `uploadAdminArticleCover` or any media library picture. With neither this nor
            `removeCover` the cover stays as it is.
        removeCover:
          type: boolean
          default: false
          description: Drops the cover; not together with `coverMediaFileId`.
        texts:
          type: array
          description: Exactly one `uk` and one `ru` text.
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/ArticleText' }

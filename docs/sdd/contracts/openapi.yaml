openapi: 3.1.0
info:
  title: KedrStore API
  version: 0.1.0
  description: >-
    Aggregate OpenAPI entry point. Feature contracts are added under this
    document through $ref after their API contract is agreed.
servers:
  - url: /
    description: Deployment origin
paths:
  /api/catalog/{lang}/categories:
    $ref: ./catalog/category-read.openapi.yaml#/paths/~1api~1catalog~1{lang}~1categories
  /api/catalog/{lang}/categories/by-slug/{categorySlug}:
    $ref: ./catalog/category-read.openapi.yaml#/paths/~1api~1catalog~1{lang}~1categories~1by-slug~1{categorySlug}
  /api/catalog/{lang}/products:
    $ref: ./catalog/products.openapi.yaml#/paths/~1api~1catalog~1{lang}~1products
  /api/catalog/{lang}/{categorySlug}/products:
    $ref: ./catalog/products.openapi.yaml#/paths/~1api~1catalog~1{lang}~1{categorySlug}~1products
  /api/catalog/{lang}/product/{productSlug}:
    $ref: ./catalog/products.openapi.yaml#/paths/~1api~1catalog~1{lang}~1product~1{productSlug}
  /api/categories:
    $ref: ./catalog/category-read.openapi.yaml#/paths/~1api~1categories
  /api/categories/{id}:
    $ref: ./catalog/category-read.openapi.yaml#/paths/~1api~1categories~1{id}
  /api/admin/products:
    $ref: ./catalog/products.openapi.yaml#/paths/~1api~1admin~1products
  /api/admin/products/all:
    $ref: ./catalog/products.openapi.yaml#/paths/~1api~1admin~1products~1all
  /api/admin/products/missing-photos:
    $ref: ./catalog/products.openapi.yaml#/paths/~1api~1admin~1products~1missing-photos
  /api/admin/products/by-slug/{productSlug}:
    $ref: ./catalog/products.openapi.yaml#/paths/~1api~1admin~1products~1by-slug~1{productSlug}
  /api/orders:
    $ref: ./catalog/orders.openapi.yaml#/paths/~1api~1orders
  /api/admin/orders:
    get:
      $ref: ./sales/manager-order-read.openapi.yaml#/paths/~1api~1admin~1orders/get
    post:
      $ref: ./sales/admin-order-one-c-sync.openapi.yaml#/paths/~1api~1admin~1orders/post
  /api/admin/orders/{orderId}:
    $ref: ./sales/manager-order-read.openapi.yaml#/paths/~1api~1admin~1orders~1{orderId}
  /api/admin/orders/{orderId}/sync-status:
    $ref: ./sales/admin-order-one-c-sync.openapi.yaml#/paths/~1api~1admin~1orders~1{orderId}~1sync-status
  /api/admin/orders/{orderId}/sync/retry:
    $ref: ./sales/admin-order-one-c-sync.openapi.yaml#/paths/~1api~1admin~1orders~1{orderId}~1sync~1retry
  /api/admin/order-workspace/orders:
    $ref: ./sales/admin-order-workspace.openapi.yaml#/paths/~1api~1admin~1order-workspace~1orders
  /api/admin/order-workspace/orders/{orderId}:
    $ref: ./sales/admin-order-workspace.openapi.yaml#/paths/~1api~1admin~1order-workspace~1orders~1{orderId}
  /api/admin/order-workspace/quote:
    $ref: ./sales/admin-order-workspace.openapi.yaml#/paths/~1api~1admin~1order-workspace~1quote
  /api/admin/order-workspace/drafts:
    $ref: ./sales/admin-order-drafts.openapi.yaml#/paths/~1api~1admin~1order-workspace~1drafts
  /api/admin/order-workspace/drafts/{draftId}:
    $ref: ./sales/admin-order-drafts.openapi.yaml#/paths/~1api~1admin~1order-workspace~1drafts~1{draftId}
  /api/admin/customers:
    $ref: ./sales/customer-read.openapi.yaml#/paths/~1api~1admin~1customers
  /api/admin/customers/{counterpartyId}:
    $ref: ./sales/customer-read.openapi.yaml#/paths/~1api~1admin~1customers~1{counterpartyId}
  /api/auth/cookie/login:
    $ref: ./identity/session.openapi.yaml#/paths/~1api~1auth~1cookie~1login
  /api/auth/cookie/logout:
    $ref: ./identity/session.openapi.yaml#/paths/~1api~1auth~1cookie~1logout
  /api/auth/mobile/login:
    $ref: ./identity/session.openapi.yaml#/paths/~1api~1auth~1mobile~1login
  /api/auth/mobile/refresh:
    $ref: ./identity/session.openapi.yaml#/paths/~1api~1auth~1mobile~1refresh
  /api/auth/mobile/logout:
    $ref: ./identity/session.openapi.yaml#/paths/~1api~1auth~1mobile~1logout
  /api/auth/session/me:
    $ref: ./identity/session.openapi.yaml#/paths/~1api~1auth~1session~1me
  /api/admin/users:
    $ref: ./identity/users.openapi.yaml#/paths/~1api~1admin~1users
  /api/admin/users/{userId}/role:
    $ref: ./identity/users.openapi.yaml#/paths/~1api~1admin~1users~1{userId}~1role
  /api/admin/users/{userId}/blocked:
    $ref: ./identity/users.openapi.yaml#/paths/~1api~1admin~1users~1{userId}~1blocked
  /api/admin/users/{userId}/password:
    $ref: ./identity/users.openapi.yaml#/paths/~1api~1admin~1users~1{userId}~1password
  /api/admin/users/{userId}/name:
    $ref: ./identity/users.openapi.yaml#/paths/~1api~1admin~1users~1{userId}~1name
  /api/admin/users/{userId}/email:
    $ref: ./identity/users.openapi.yaml#/paths/~1api~1admin~1users~1{userId}~1email
  /api/admin/users/{userId}/avatar:
    $ref: ./identity/users.openapi.yaml#/paths/~1api~1admin~1users~1{userId}~1avatar
  /api/profile:
    $ref: ./identity/profile.openapi.yaml#/paths/~1api~1profile
  /api/profile/name:
    $ref: ./identity/profile.openapi.yaml#/paths/~1api~1profile~1name
  /api/profile/avatar:
    $ref: ./identity/profile.openapi.yaml#/paths/~1api~1profile~1avatar
  /api/profile/email:
    $ref: ./identity/profile.openapi.yaml#/paths/~1api~1profile~1email
  /api/profile/password:
    $ref: ./identity/profile.openapi.yaml#/paths/~1api~1profile~1password
  /api/sales/{lang}/catalog/products:
    $ref: ./sales/catalog.openapi.yaml#/paths/~1api~1sales~1{lang}~1catalog~1products
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-kedr.session

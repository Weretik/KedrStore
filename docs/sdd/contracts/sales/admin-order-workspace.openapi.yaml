openapi: 3.1.0
info:
  title: Sales Admin order workspace API
  version: 0.1.0
  description: Implemented isolated React Admin order workspace API, included in aggregate openapi.yaml.
servers:
  - url: /
paths:
  /api/admin/order-workspace/orders:
    get:
      operationId: getAdminWorkspaceOrders
      summary: Search persisted Admin orders
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: searchTerm, in: query, schema: { type: string, maxLength: 100 } }
        - { name: counterpartyId, in: query, schema: { type: string, maxLength: 64 } }
        - { name: createdFrom, in: query, description: Inclusive calendar date in Europe/Kyiv., schema: { type: string, format: date } }
        - { name: createdTo, in: query, description: Inclusive calendar date in Europe/Kyiv., schema: { type: string, format: date } }
        - name: sort
          in: query
          schema: { type: string, enum: [createdAt, '-createdAt', orderNumber, '-orderNumber', customerName, '-customerName', totalAmount, '-totalAmount'], default: '-createdAt' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Filtered page; totalRecords is computed before paging.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '400': { description: Invalid query. }
        '401': { description: Not signed in. }
        '403': { description: Signed in without the Manager or Admin role. }
    post:
      operationId: createAdminWorkspaceOrder
      summary: Create one priced order and pending 1C sync
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Order created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateOrderResponse' }
        '200':
          description: Idempotent replay of the same request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateOrderResponse' }
        '400': { description: "Invalid lines, customer, price or request." }
        '404': { description: Selected customer or product does not exist. }
        '409':
          description: Quote changed or idempotency key reused with different request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderConflict' }
        '401': { description: Not signed in. }
        '403': { description: Signed in without the Manager or Admin role. }
  /api/admin/order-workspace/orders/{orderId}:
    get:
      operationId: getAdminWorkspaceOrderById
      summary: Read a persisted Admin order
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Stored order snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '404': { description: Order not found. }
        '401': { description: Not signed in. }
        '403': { description: Signed in without the Manager or Admin role. }
  /api/admin/order-workspace/quote:
    post:
      operationId: quoteAdminWorkspaceOrder
      summary: Price a selected customer's lines without persisting an order
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: Current server-calculated quote.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400':
          description: >-
            Invalid lines (invalid_lines), invalid price adjustment (invalid_price_adjustment), insufficient stock
            (unavailable_product), unavailable UAH price (unavailable_price) or a discount larger than the price
            (negative_price).
          content:
            application/json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, example: unavailable_product }
                  message: { type: string, example: Недостатньо товару на складі. }
        '404': { description: Selected customer or product does not exist. }
        '401': { description: Not signed in. }
        '403': { description: Signed in without the Manager or Admin role. }
  /api/admin/order-workspace/customer-prices:
    post:
      operationId: getAdminWorkspaceCustomerPrices
      summary: Read a customer's unit prices for products, ignoring stock
      description: >-
        Uses the price type of the nearest customer rule on the product's category or any parent category,
        otherwise the customer's default price type. A product without such a UAH price, or an unknown product,
        returns a null unitPrice.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerPricesRequest' }
      responses:
        '200':
          description: Customer prices in the requested product order, duplicates removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPrices' }
        '400': { description: Missing customer or 1-100 valid product IDs not supplied (code invalid_products). }
        '404': { description: Selected customer does not exist. }
        '401': { description: Not signed in. }
        '403': { description: Signed in without the Manager or Admin role. }
components:
  schemas:
    Money: { type: number, multipleOf: 0.01, minimum: 0 }
    PriceAdjustment:
      type: number
      multipleOf: 0.01
      minimum: -1000000
      maximum: 1000000
      description: Per-unit discount (negative) or markup (positive) in UAH applied on top of the customer price.
    PagedInfo:
      type: object
      required: [pageNumber, pageSize, totalPages, totalRecords]
      properties:
        pageNumber: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, minimum: 0 }
        totalRecords: { type: integer, minimum: 0 }
    OrderPage:
      type: object
      required: [pagedInfo, value]
      properties:
        pagedInfo: { $ref: '#/components/schemas/PagedInfo' }
        value: { type: array, items: { $ref: '#/components/schemas/OrderListItem' } }
    OrderListItem:
      type: object
      required: [orderId, orderNumber, counterpartyId, counterpartyName, createdAtUtc, lineCount, totalAmount, syncStatus, adjustmentAmount]
      properties:
        orderId: { type: integer, format: int64, minimum: 1 }
        orderNumber: { type: string, maxLength: 64 }
        counterpartyId: { type: string, maxLength: 64 }
        counterpartyName: { type: string, maxLength: 300 }
        createdAtUtc: { type: string, format: date-time }
        lineCount: { type: integer, minimum: 1 }
        totalAmount: { $ref: '#/components/schemas/Money' }
        syncStatus: { type: string }
        adjustmentAmount:
          type: number
          multipleOf: 0.01
          description: Sum of discounts (negative) and markups (positive) over all units; 0 when none.
    OrderDetail:
      type: object
      required: [orderId, orderNumber, counterpartyId, counterpartyName, createdAtUtc, lines, totalAmount, syncStatus]
      properties:
        orderId: { type: integer, format: int64, minimum: 1 }
        orderNumber: { type: string, maxLength: 64 }
        counterpartyId: { type: string, maxLength: 64 }
        counterpartyName: { type: string, maxLength: 300 }
        createdAtUtc: { type: string, format: date-time }
        comment: { type: [string, 'null'], maxLength: 1000 }
        lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/StoredLine' } }
        totalAmount: { $ref: '#/components/schemas/Money' }
        syncStatus: { type: string }
        oneCDocumentNumber: { type: [string, 'null'] }
    StoredLine:
      type: object
      required: [productId, productName, quantity, amount, priceAdjustment]
      properties:
        productId: { type: string, maxLength: 64 }
        productName: { type: string, maxLength: 512 }
        quantity: { type: integer, minimum: 1 }
        amount: { $ref: '#/components/schemas/Money' }
        priceAdjustment: { $ref: '#/components/schemas/PriceAdjustment' }
    InputLine:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, minLength: 1, maxLength: 64 }
        quantity: { type: integer, minimum: 1 }
        priceAdjustment:
          allOf: [{ $ref: '#/components/schemas/PriceAdjustment' }]
          default: 0
    QuoteRequest:
      type: object
      required: [counterpartyId, lines]
      properties:
        counterpartyId: { type: string, minLength: 1, maxLength: 64 }
        lines: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/InputLine' } }
    QuoteLine:
      type: object
      required: [productId, productName, quantity, unitPrice, lineAmount, baseUnitPrice, priceAdjustment]
      properties:
        productId: { type: string, maxLength: 64 }
        productName: { type: string, maxLength: 512 }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { $ref: '#/components/schemas/Money' }
        lineAmount: { $ref: '#/components/schemas/Money' }
        baseUnitPrice: { $ref: '#/components/schemas/Money' }
        priceAdjustment: { $ref: '#/components/schemas/PriceAdjustment' }
    Quote:
      type: object
      required: [counterpartyId, lines, totalAmount, quoteFingerprint]
      properties:
        counterpartyId: { type: string, maxLength: 64 }
        lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/QuoteLine' } }
        totalAmount: { $ref: '#/components/schemas/Money' }
        quoteFingerprint: { type: string, minLength: 1 }
    CreateOrderRequest:
      allOf:
        - { $ref: '#/components/schemas/QuoteRequest' }
        - type: object
          required: [quoteFingerprint]
          properties:
            quoteFingerprint: { type: string, minLength: 1 }
            comment: { type: [string, 'null'], maxLength: 1000 }
    CreateOrderResponse:
      type: object
      required: [orderId, orderNumber, totalAmount, syncStatus]
      properties:
        orderId: { type: integer, format: int64, minimum: 1 }
        orderNumber: { type: string, maxLength: 64 }
        totalAmount: { $ref: '#/components/schemas/Money' }
        syncStatus: { type: string, enum: [Pending] }
    OrderConflict:
      type: object
      required: [code]
      properties:
        code: { type: string, enum: [quote_changed, idempotency_conflict] }
        quote:
          oneOf:
            - { $ref: '#/components/schemas/Quote' }
            - { type: 'null' }
    CustomerPricesRequest:
      type: object
      required: [counterpartyId, productIds]
      properties:
        counterpartyId: { type: string, minLength: 1, maxLength: 64 }
        productIds: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 10 } }
    CustomerPrices:
      type: object
      required: [counterpartyId, prices]
      properties:
        counterpartyId: { type: string, maxLength: 64 }
        prices:
          type: array
          items:
            type: object
            required: [productId, unitPrice]
            properties:
              productId: { type: string, maxLength: 64 }
              unitPrice: { type: [number, 'null'], multipleOf: 0.01, minimum: 0 }

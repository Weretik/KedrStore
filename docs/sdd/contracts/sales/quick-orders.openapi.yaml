openapi: 3.1.0
info: { title: KedrStore Orders API, version: 0.1.0 }
paths:
  /api/orders:
    post:
      operationId: createQuickOrder
      summary: Create a quick order
      tags: [Orders]
      security: []
      description: >-
        Creates a quick order (anonymous). Send an Idempotency-Key made once per order attempt and reuse it when the
        same order is sent again (a second press, a retry after a timeout): the repeat answers 200 with the first
        order id and nothing is sent to Telegram again. The key becomes the order id. The same key with other data
        answers 409 (problem code `conflict` with a Ukrainian detail). Without the header every request is a new order.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, format: uuid }
          description: One key per order attempt; kept while the stored order is kept (outbox retention, 30 days).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '200': { description: Created order, content: { application/json: { schema: { $ref: '#/components/schemas/QuickOrderResponse' } } } }
        '400': { description: Input validation failed }
        '409': { description: The Idempotency-Key was already used with other data (code conflict), content: { application/problem+json: { schema: { $ref: '../problem.openapi.yaml#/components/schemas/Problem' } } } }
        '429': { description: Quick order flood limit exceeded (60 per 10 minutes per calling address; the public site calls from its server) }
components:
  schemas:
    CreateOrderRequest:
      type: object
      required: [firstName, phone, lines]
      properties:
        firstName: { type: string, maxLength: 30 }
        phone: { type: string, maxLength: 20 }
        lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/CreateOrderLineRequest' } }
    CreateOrderLineRequest:
      type: object
      required: [productId, title, unitPrice, quantity]
      properties:
        productId: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        unitPrice: { type: number }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
    QuickOrderResponse:
      type: object
      required: [orderId]
      properties: { orderId: { type: string, format: uuid } }

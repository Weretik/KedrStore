openapi: 3.1.0
info:
  title: KedrStore Catalog API
  version: 0.1.0
paths:
  /api/catalog/{lang}/products:
    get:
      operationId: getPublicProducts
      summary: List public products
      description: >-
        When `categoryId` is supplied, the page contains public products of that category and of every
        descendant category at any depth; sibling branches are excluded. The category subtree and all
        other filters are applied before `pagedInfo.totalRecords`, sorting, and paging. An unknown valid
        `categoryId` returns `200` with an empty page and `totalRecords = 0`.
      tags: [Catalog]
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/InStock'
        - $ref: '#/components/parameters/IsSale'
        - $ref: '#/components/parameters/IsNew'
        - $ref: '#/components/parameters/PriceTypeId'
        - $ref: '#/components/parameters/PriceFrom'
        - $ref: '#/components/parameters/PriceTo'
        - $ref: '#/components/parameters/Availability'
        - $ref: '#/components/parameters/AttributeFilter'
        - $ref: '#/components/parameters/GroupVariants'
        - $ref: '#/components/parameters/ProductSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Product page, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/catalog/{lang}/{categorySlug}/products:
    get:
      operationId: getPublicProductsByCategorySlug
      summary: List public products in a category
      description: >-
        Returns public products of the category selected by `categorySlug` and of every descendant
        category at any depth; sibling branches are excluded. When `categoryId` is also supplied, it takes
        precedence over the slug. The category subtree and all other filters are applied before
        `pagedInfo.totalRecords`, sorting, and paging. A former category slug selects its category. An
        unknown or deleted category slug returns `404`; an unknown `categoryId` returns `200` with an empty page.
      tags: [Catalog]
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: categorySlug
          in: path
          required: true
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/InStock'
        - $ref: '#/components/parameters/IsSale'
        - $ref: '#/components/parameters/IsNew'
        - $ref: '#/components/parameters/PriceTypeId'
        - $ref: '#/components/parameters/PriceFrom'
        - $ref: '#/components/parameters/PriceTo'
        - $ref: '#/components/parameters/Availability'
        - $ref: '#/components/parameters/AttributeFilter'
        - $ref: '#/components/parameters/GroupVariants'
        - $ref: '#/components/parameters/ProductSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Product page, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: 'Unknown or deleted category slug, or an unknown attribute or value slug in `filter`.' }
  /api/catalog/{lang}/{categorySlug}/facets:
    get:
      operationId: getCategoryFacets
      summary: Get the attribute filters of a category with counts
      description: >-
        Spec catalog/006, phase 5. The attributes the category tree offers as filters («Фільтри категорій»), with the
        values its on-site products have. A count is the number of cards (a variant group is one card) the list would
        show with that value added: other attributes' choices apply, the attribute's own do not. Only values a person
        confirmed count. A value without cards is left out unless chosen; an attribute without values is left out.
        Takes the same query as the category product list.
      tags: [Catalog]
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: categorySlug
          in: path
          required: true
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/InStock'
        - $ref: '#/components/parameters/IsSale'
        - $ref: '#/components/parameters/IsNew'
        - $ref: '#/components/parameters/PriceFrom'
        - $ref: '#/components/parameters/PriceTo'
        - $ref: '#/components/parameters/Availability'
        - $ref: '#/components/parameters/AttributeFilter'
      responses:
        '200': { description: Filters with counts, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryFacets' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: 'Unknown or deleted category slug, or an unknown attribute or value slug in `filter`.' }
  /api/catalog/{lang}/product/{productSlug}:
    get:
      operationId: getPublicProductBySlug
      summary: Get a public product by slug
      description: >-
        A former slug returns 200 with `productSlug` set to the current slug, so the client can redirect permanently.
        A product of a deleted category is not public.
      tags: [Catalog]
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: productSlug
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/PriceTypeId'
      responses:
        '200': { description: Product, content: { application/json: { schema: { $ref: '#/components/schemas/ProductDetails' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: >-
            Product not found. For a deleted product whose category is active the body names that category;
            otherwise there is no body.
          content:
            application/json:
              schema: { $ref: './category-read.openapi.yaml#/components/schemas/CatalogRedirect' }
  /api/admin/products:
    get:
      operationId: getAdminProducts
      summary: List admin product rows
      tags: [Admin products]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      description: Policy CanManageProducts (Manager and Admin).
      parameters:
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/CategorySlug'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/AdminInStock'
        - $ref: '#/components/parameters/IsSale'
        - $ref: '#/components/parameters/IsNew'
        - $ref: '#/components/parameters/ExportToSite'
        - $ref: '#/components/parameters/PriceFrom'
        - $ref: '#/components/parameters/PriceTo'
        - name: withoutPhoto
          in: query
          description: '`true` lists only products without a linked photo (`photo` is an empty string).'
          schema: { type: boolean }
        - name: problemsOnly
          in: query
          description: '`true` lists only products whose attributes need review («Тільки проблемні», spec catalog/006).'
          schema: { type: boolean }
        - name: problemReason
          in: query
          description: Lists only products that need review for this reason code, for example `no_name`.
          schema: { type: string, maxLength: 64 }
        - name: deleted
          in: query
          description: >-
            `true` lists soft-deleted products only (newest deletion first; search by Ukrainian name or 1C code;
            other filters and sort are ignored). Admin role only.
          schema: { type: boolean }
        - $ref: '#/components/parameters/ProductSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Admin product page, content: { application/json: { schema: { $ref: '#/components/schemas/AdminProductPage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Not signed in. }
        '403': { description: 'Signed in without the Manager or Admin role, or `deleted=true` without the Admin role.' }
  /api/admin/products/{id}/slug:
    put:
      operationId: changeAdminProductSlug
      summary: Set or regenerate a product slug
      description: >-
        The previous slug moves to history and keeps resolving to this product. A slug used now or before by
        another product is rejected. Repeating the same request is safe.
      tags: [Admin products]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './category-read.openapi.yaml#/components/schemas/ChangeSlugRequest' }
      responses:
        '200':
          description: Slug changed (or already equal).
          content:
            application/json:
              schema: { $ref: './category-read.openapi.yaml#/components/schemas/ChangeSlugResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Not signed in. }
        '403': { description: Signed in without the Admin role. }
        '404': { description: Product not found or deleted. }
  /api/admin/products/all:
    get:
      operationId: getAllAdminProducts
      summary: List all admin product rows
      tags: [Admin products]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      description: Policy CanManageProducts (Manager and Admin). Returns the unpaged admin row model.
      responses:
        '200': { description: All admin products, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminProduct' } } } } }
        '401': { description: Not signed in. }
        '403': { description: Signed in without the Manager or Admin role. }
  /api/admin/products/{id}/media:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getAdminProductMedia
      summary: Get the photos and the scheme linked to a product
      tags: [Admin products]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      description: >-
        Policies CanManageProducts and CanManageMedia (Manager and Admin). Photos come in gallery order; file names
        are read from the media library.
      responses:
        '200': { description: Product media set, content: { application/json: { schema: { $ref: '#/components/schemas/ProductMedia' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Not signed in. }
        '403': { description: Signed in without the Manager or Admin role. }
        '404': { description: Product not found or deleted. }
    put:
      operationId: setAdminProductMedia
      summary: Replace the photos and the scheme of a product
      tags: [Admin products]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      description: >-
        Replaces the whole set with media library files: up to 20 photos in order (the first is the list photo)
        and an optional scheme. A file can appear once. Every ID must exist in the library.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetProductMediaRequest' }
      responses:
        '200': { description: Saved set, content: { application/json: { schema: { $ref: '#/components/schemas/ProductMedia' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Not signed in. }
        '403': { description: Signed in without the Manager or Admin role. }
        '404': { description: Product not found or deleted. }
  /api/admin/products/by-slug/{productSlug}:
    get:
      operationId: getAdminProductBySlug
      summary: Get one admin product by slug
      tags: [Admin products]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      description: Policy CanManageProducts (Manager and Admin).
      parameters:
        - name: productSlug
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '200': { description: Admin product details, content: { application/json: { schema: { $ref: '#/components/schemas/AdminProductDetails' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: Product not found }
        '401': { description: Not signed in. }
        '403': { description: Signed in without the Manager or Admin role. }
components:
  parameters:
    Lang: { name: lang, in: path, required: true, schema: { type: string, enum: [uk, ru] } }
    SearchTerm: { name: searchTerm, in: query, schema: { type: string, maxLength: 100 } }
    CategorySlug: { name: categorySlug, in: query, schema: { type: string, maxLength: 100 } }
    CategoryId: { name: categoryId, in: query, schema: { type: integer, minimum: 1 } }
    InStock: { name: inStock, in: query, schema: { type: boolean, default: true } }
    AdminInStock: { name: inStock, in: query, schema: { type: boolean } }
    IsSale: { name: isSale, in: query, schema: { type: boolean } }
    IsNew: { name: isNew, in: query, schema: { type: boolean } }
    ExportToSite: { name: exportToSite, in: query, schema: { type: boolean } }
    PriceTypeId: { name: priceTypeId, in: query, schema: { type: integer, minimum: 1, default: 11 } }
    PriceFrom: { name: priceFrom, in: query, schema: { type: number, minimum: 0 } }
    PriceTo: { name: priceTo, in: query, schema: { type: number, minimum: 0 } }
    ProductSort: { name: sort, in: query, schema: { type: string, enum: [IdAsc, IdDesc, NameAsc, NameDesc, PriceAsc, PriceDesc, CategoryAsc, CategoryDesc, AvailabilityThenName], default: IdAsc } }
    Availability:
      name: availability
      in: query
      description: '`InStock` or `All`. When supplied it takes precedence over `inStock`; when absent `inStock` applies as before.'
      schema: { type: string, enum: [InStock, All] }
    AttributeFilter:
      name: filter
      in: query
      description: >-
        Attribute filter `attribute-slug:value-slug[,value-slug]`, repeatable (spec catalog/006). Values of one attribute
        match any of them, different attributes all; only confirmed values match. At most 50 values. Malformed: `400`;
        unknown attribute or value slug: `404`.
      style: form
      explode: true
      schema: { type: array, items: { type: string, maxLength: 200 } }
    GroupVariants:
      name: groupVariants
      in: query
      description: >-
        `true` returns one row per variant group, at the place of its first matching product: the group's main
        product when it matches, otherwise the first matching variant. Counts and pages are in cards.
      schema: { type: boolean, default: false }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  responses:
    ValidationError: { description: Input validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationErrors' } } } }
  schemas:
    ValidationErrors: { type: array, items: { type: object, additionalProperties: true } }
    PagedInfo:
      type: object
      required: [pageNumber, pageSize, totalPages, totalRecords]
      properties:
        pageNumber: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer, format: int64 }
        totalRecords: { type: integer, format: int64 }
    ProductPage:
      type: object
      required: [pagedInfo, value]
      properties:
        pagedInfo: { $ref: '#/components/schemas/PagedInfo' }
        value: { type: array, items: { $ref: '#/components/schemas/ProductListItem' } }
    AdminProductPage:
      type: object
      required: [pagedInfo, value]
      properties:
        pagedInfo: { $ref: '#/components/schemas/PagedInfo' }
        value: { type: array, items: { $ref: '#/components/schemas/AdminProduct' } }
    ProductListItem:
      type: object
      required: [id, name, productSlug, photo, inStock, isSale, isNew]
      properties:
        id: { type: integer }
        name: { type: string }
        productSlug: { type: string }
        photo: { type: string, description: First photo URL; an empty string when the product has no photo. }
        categoryId: { type: [integer, 'null'] }
        inStock: { type: boolean }
        isSale: { type: boolean }
        isNew: { type: boolean }
        price: { type: [number, 'null'] }
        variantCount: { type: [integer, 'null'], description: 'With `groupVariants`: on-site variants of the group, this one included; null for a single product.' }
        swatches:
          type: [array, 'null']
          description: 'With `groupVariants`: colors of the group''s on-site variants in dictionary order.'
          items: { $ref: '#/components/schemas/ProductSwatch' }
    ProductSwatch:
      type: object
      required: [slug, name]
      description: A color circle (`hex`), a texture picture (`textureUrl`), or only the name when neither is set.
      properties:
        slug: { type: string }
        name: { type: string }
        hex: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
        textureUrl: { type: [string, 'null'] }
    CategoryFacets:
      type: object
      required: [totalCards, facets]
      properties:
        totalCards: { type: integer, description: Cards with every choice applied. }
        facets: { type: array, items: { $ref: '#/components/schemas/CategoryFacet' } }
    CategoryFacet:
      type: object
      required: [code, slug, name, display, values]
      properties:
        code: { type: string }
        slug: { type: string, description: The attribute part of `filter`. }
        name: { type: string }
        display: { type: string, enum: [swatch, button, checkbox] }
        values: { type: array, items: { $ref: '#/components/schemas/CategoryFacetValue' } }
    CategoryFacetValue:
      type: object
      required: [slug, name, count, selected]
      properties:
        slug: { type: string }
        name: { type: string }
        hex: { type: [string, 'null'] }
        textureUrl: { type: [string, 'null'] }
        count: { type: integer }
        selected: { type: boolean }
    ProductDetails:
      type: object
      required: [id, name, productSlug, photo, scheme, photos, stock, categoryName, categorySlug, quantityInPack, breadcrumbs, updatedAt]
      properties:
        id: { type: integer, description: 1C product code shown to customers as the article. }
        name: { type: string }
        productSlug: { type: string, description: Current slug; differs from the request when a former slug was used. }
        updatedAt: { type: string, format: date-time }
        photo: { type: string, description: First photo URL; an empty string when the product has no photo. }
        scheme: { type: string, description: Scheme URL; an empty string when the product has no scheme. }
        photos: { type: array, items: { type: string }, description: All photo URLs in gallery order; the first equals photo. }
        stock: { type: number }
        categoryName: { type: string }
        categorySlug: { type: string }
        quantityInPack: { type: integer }
        price: { type: [number, 'null'] }
        breadcrumbs: { type: array, items: { $ref: '#/components/schemas/Breadcrumb' } }
        variants:
          oneOf:
            - { $ref: '#/components/schemas/ProductVariants' }
            - { type: 'null' }
          description: The variant group when it has at least two variants on the site (spec catalog/006).
        characteristics:
          type: array
          description: Confirmed attribute values for «Характеристики», in attribute order.
          items:
            type: object
            required: [code, name, value]
            properties: { code: { type: string }, name: { type: string }, value: { type: string } }
    ProductVariants:
      type: object
      required: [groupName, groupSlug, axes, items]
      properties:
        groupName: { type: string }
        groupSlug: { type: string }
        mainProductSlug: { type: [string, 'null'], description: The group's main product on the site; the canonical page. }
        axes:
          type: array
          description: Variant attributes (color, size, side) whose values differ inside the group.
          items:
            type: object
            required: [code, slug, name, display, values]
            properties:
              code: { type: string }
              slug: { type: string }
              name: { type: string }
              display: { type: string, enum: [swatch, button] }
              values:
                type: array
                items:
                  type: object
                  required: [key, name, swatches]
                  properties:
                    key: { type: string, description: 'Value slug; a two-color value joins the slugs with `+`.' }
                    name: { type: string }
                    swatches: { type: array, items: { $ref: '#/components/schemas/ProductSwatch' } }
        items:
          type: array
          items:
            type: object
            required: [id, productSlug, name, photo, inStock, isCurrent, isMain, values]
            properties:
              id: { type: integer }
              productSlug: { type: string }
              name: { type: string }
              photo: { type: string }
              price: { type: [number, 'null'] }
              inStock: { type: boolean }
              isCurrent: { type: boolean }
              isMain: { type: boolean }
              values: { type: object, additionalProperties: { type: string }, description: Axis code → value key; missing when the variant has none. }
    Breadcrumb:
      type: object
      required: [id, name, slug]
      properties: { id: { type: integer }, name: { type: string }, slug: { type: string } }
    AdminProduct:
      type: object
      required: [id, nameUk, nameRu, productSlug, photo, categoryName, inStock, isSale, isNew, exportToSite, stock, quantityInPack]
      properties:
        id: { type: integer }
        nameUk: { type: string }
        nameRu: { type: string }
        productSlug: { type: string }
        photo: { type: string, description: First photo URL; an empty string when the product has no photo. }
        categoryId: { type: [integer, 'null'] }
        categoryName: { type: string, description: Ukrainian short category name; empty when the reference is unavailable. }
        inStock: { type: boolean }
        isSale: { type: boolean }
        isNew: { type: boolean }
        exportToSite:
          type: boolean
          description: Whether the product is marked for export to the website by the 1C import.
        price: { type: [number, 'null'] }
        stock: { type: number }
        quantityInPack: { type: integer }
        isDeleted: { type: boolean }
        deletedAt: { type: [string, 'null'], format: date-time }
        groupId: { type: [integer, 'null'], description: 'Variant group of the product (spec catalog/006); filled by the paged list only.' }
        groupName: { type: [string, 'null'] }
        problems:
          type: array
          description: Why the product's attributes need review; empty when they do not or the product was accepted. Filled by the paged list only.
          items: { $ref: './attributes.openapi.yaml#/components/schemas/AdminAttributeProblem' }
    AdminProductDetails:
      type: object
      required: [id, nameUk, nameRu, productSlug, photo, scheme, categoryId, categoryName, inStock, isSale, isNew, exportToSite, price, stock, quantityInPack]
      properties:
        id: { type: integer }
        nameUk: { type: string }
        nameRu: { type: string }
        productSlug: { type: string }
        photo: { type: string, description: First photo URL; an empty string when the product has no photo. }
        scheme: { type: string, description: Scheme URL; an empty string when the product has no scheme. }
        categoryId: { type: integer }
        categoryName: { type: string }
        inStock: { type: boolean }
        isSale: { type: boolean }
        isNew: { type: boolean }
        exportToSite: { type: boolean }
        price: { type: [number, 'null'] }
        stock: { type: number }
        quantityInPack: { type: integer }
    SetProductMediaRequest:
      type: object
      required: [photoIds]
      properties:
        photoIds: { type: array, maxItems: 20, uniqueItems: true, items: { type: integer, format: int64, minimum: 1 } }
        schemeId: { type: [integer, 'null'], format: int64, minimum: 1, description: Must not be one of photoIds. }
    ProductMediaItem:
      type: object
      required: [id, url, fileName]
      properties:
        id: { type: integer, format: int64, description: Media library file ID. }
        url: { type: string }
        fileName: { type: string, description: Library display name; empty if the file was deleted and the link is not yet dropped. }
    ProductMedia:
      type: object
      required: [productId, photos, scheme]
      properties:
        productId: { type: integer }
        photos: { type: array, items: { $ref: '#/components/schemas/ProductMediaItem' } }
        scheme:
          oneOf:
            - { $ref: '#/components/schemas/ProductMediaItem' }
            - { type: 'null' }

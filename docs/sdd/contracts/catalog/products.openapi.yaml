openapi: 3.1.0
info:
  title: KedrStore Catalog API
  version: 0.1.0
paths:
  /api/catalog/{lang}/products:
    get:
      operationId: getPublicProducts
      summary: List public products
      description: >-
        When `categoryId` is supplied, the page contains public products of that category and of every
        descendant category at any depth; sibling branches are excluded. The category subtree and all
        other filters are applied before `pagedInfo.totalRecords`, sorting, and paging. An unknown valid
        `categoryId` returns `200` with an empty page and `totalRecords = 0`.
      tags: [Catalog]
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/InStock'
        - $ref: '#/components/parameters/IsSale'
        - $ref: '#/components/parameters/IsNew'
        - $ref: '#/components/parameters/PriceTypeId'
        - $ref: '#/components/parameters/PriceFrom'
        - $ref: '#/components/parameters/PriceTo'
        - $ref: '#/components/parameters/Availability'
        - $ref: '#/components/parameters/ProductSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Product page, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/catalog/{lang}/{categorySlug}/products:
    get:
      operationId: getPublicProductsByCategorySlug
      summary: List public products in a category
      description: >-
        Returns public products of the category selected by `categorySlug` and of every descendant
        category at any depth; sibling branches are excluded. When `categoryId` is also supplied, it takes
        precedence over the slug. The category subtree and all other filters are applied before
        `pagedInfo.totalRecords`, sorting, and paging. A former category slug selects its category. An
        unknown or deleted category slug returns `404`; an unknown `categoryId` returns `200` with an empty page.
      tags: [Catalog]
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: categorySlug
          in: path
          required: true
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/InStock'
        - $ref: '#/components/parameters/IsSale'
        - $ref: '#/components/parameters/IsNew'
        - $ref: '#/components/parameters/PriceTypeId'
        - $ref: '#/components/parameters/PriceFrom'
        - $ref: '#/components/parameters/PriceTo'
        - $ref: '#/components/parameters/Availability'
        - $ref: '#/components/parameters/ProductSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Product page, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: Unknown or deleted category slug. }
  /api/catalog/{lang}/product/{productSlug}:
    get:
      operationId: getPublicProductBySlug
      summary: Get a public product by slug
      description: >-
        A former slug returns 200 with `productSlug` set to the current slug, so the client can redirect permanently.
        A product of a deleted category is not public.
      tags: [Catalog]
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: productSlug
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/PriceTypeId'
      responses:
        '200': { description: Product, content: { application/json: { schema: { $ref: '#/components/schemas/ProductDetails' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: >-
            Product not found. For a deleted product whose category is active the body names that category;
            otherwise there is no body.
          content:
            application/json:
              schema: { $ref: './category-read.openapi.yaml#/components/schemas/CatalogRedirect' }
  /api/admin/products:
    get:
      operationId: getAdminProducts
      summary: List admin product rows
      tags: [Admin products]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      description: Policy CanManageProducts (Manager and Admin).
      parameters:
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/CategorySlug'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/AdminInStock'
        - $ref: '#/components/parameters/IsSale'
        - $ref: '#/components/parameters/IsNew'
        - $ref: '#/components/parameters/ExportToSite'
        - $ref: '#/components/parameters/PriceFrom'
        - $ref: '#/components/parameters/PriceTo'
        - name: deleted
          in: query
          description: >-
            `true` lists soft-deleted products only (newest deletion first; search by Ukrainian name or 1C code;
            other filters and sort are ignored). Admin role only.
          schema: { type: boolean }
        - $ref: '#/components/parameters/ProductSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Admin product page, content: { application/json: { schema: { $ref: '#/components/schemas/AdminProductPage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Not signed in. }
        '403': { description: 'Signed in without the Manager or Admin role, or `deleted=true` without the Admin role.' }
  /api/admin/products/{id}/slug:
    put:
      operationId: changeAdminProductSlug
      summary: Set or regenerate a product slug
      description: >-
        The previous slug moves to history and keeps resolving to this product. A slug used now or before by
        another product is rejected. Repeating the same request is safe.
      tags: [Admin products]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './category-read.openapi.yaml#/components/schemas/ChangeSlugRequest' }
      responses:
        '200':
          description: Slug changed (or already equal).
          content:
            application/json:
              schema: { $ref: './category-read.openapi.yaml#/components/schemas/ChangeSlugResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Not signed in. }
        '403': { description: Signed in without the Admin role. }
        '404': { description: Product not found or deleted. }
  /api/admin/products/all:
    get:
      operationId: getAllAdminProducts
      summary: List all admin product rows
      tags: [Admin products]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      description: Policy CanManageProducts (Manager and Admin). Returns the unpaged admin row model.
      responses:
        '200': { description: All admin products, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminProduct' } } } } }
        '401': { description: Not signed in. }
        '403': { description: Signed in without the Manager or Admin role. }
  /api/admin/products/missing-photos:
    get:
      operationId: getAdminProductsWithUnavailablePhotos
      summary: List active products whose latest photo check is unavailable
      tags: [Admin products]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      description: >-
        Policy CanManageProducts. Reads persisted photo-check state only and does
        not contact the CDN while handling the request.
      parameters:
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/AdminInStock'
        - $ref: '#/components/parameters/IsSale'
        - $ref: '#/components/parameters/IsNew'
        - $ref: '#/components/parameters/ExportToSite'
        - $ref: '#/components/parameters/ProductSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Unavailable product-photo page, content: { application/json: { schema: { $ref: '#/components/schemas/MissingProductPhotoPage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Not signed in. }
        '403': { description: Signed in without the Manager or Admin role. }
  /api/admin/products/by-slug/{productSlug}:
    get:
      operationId: getAdminProductBySlug
      summary: Get one admin product by slug
      tags: [Admin products]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      description: Policy CanManageProducts (Manager and Admin).
      parameters:
        - name: productSlug
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '200': { description: Admin product details, content: { application/json: { schema: { $ref: '#/components/schemas/AdminProductDetails' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: Product not found }
        '401': { description: Not signed in. }
        '403': { description: Signed in without the Manager or Admin role. }
components:
  parameters:
    Lang: { name: lang, in: path, required: true, schema: { type: string, enum: [uk, ru] } }
    SearchTerm: { name: searchTerm, in: query, schema: { type: string, maxLength: 100 } }
    CategorySlug: { name: categorySlug, in: query, schema: { type: string, maxLength: 100 } }
    CategoryId: { name: categoryId, in: query, schema: { type: integer, minimum: 1 } }
    InStock: { name: inStock, in: query, schema: { type: boolean, default: true } }
    AdminInStock: { name: inStock, in: query, schema: { type: boolean } }
    IsSale: { name: isSale, in: query, schema: { type: boolean } }
    IsNew: { name: isNew, in: query, schema: { type: boolean } }
    ExportToSite: { name: exportToSite, in: query, schema: { type: boolean } }
    PriceTypeId: { name: priceTypeId, in: query, schema: { type: integer, minimum: 1, default: 11 } }
    PriceFrom: { name: priceFrom, in: query, schema: { type: number, minimum: 0 } }
    PriceTo: { name: priceTo, in: query, schema: { type: number, minimum: 0 } }
    ProductSort: { name: sort, in: query, schema: { type: string, enum: [IdAsc, IdDesc, NameAsc, NameDesc, PriceAsc, PriceDesc, CategoryAsc, CategoryDesc, AvailabilityThenName], default: IdAsc } }
    Availability:
      name: availability
      in: query
      description: '`InStock` or `All`. When supplied it takes precedence over `inStock`; when absent `inStock` applies as before.'
      schema: { type: string, enum: [InStock, All] }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  responses:
    ValidationError: { description: Input validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationErrors' } } } }
  schemas:
    ValidationErrors: { type: array, items: { type: object, additionalProperties: true } }
    PagedInfo:
      type: object
      required: [pageNumber, pageSize, totalPages, totalRecords]
      properties:
        pageNumber: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer, format: int64 }
        totalRecords: { type: integer, format: int64 }
    ProductPage:
      type: object
      required: [pagedInfo, value]
      properties:
        pagedInfo: { $ref: '#/components/schemas/PagedInfo' }
        value: { type: array, items: { $ref: '#/components/schemas/ProductListItem' } }
    AdminProductPage:
      type: object
      required: [pagedInfo, value]
      properties:
        pagedInfo: { $ref: '#/components/schemas/PagedInfo' }
        value: { type: array, items: { $ref: '#/components/schemas/AdminProduct' } }
    MissingProductPhotoPage:
      type: object
      required: [pagedInfo, value]
      properties:
        pagedInfo: { $ref: '#/components/schemas/PagedInfo' }
        value: { type: array, items: { $ref: '#/components/schemas/MissingProductPhoto' } }
    ProductListItem:
      type: object
      required: [id, name, productSlug, photo, inStock, isSale, isNew]
      properties:
        id: { type: integer }
        name: { type: string }
        productSlug: { type: string }
        photo: { type: string }
        categoryId: { type: [integer, 'null'] }
        inStock: { type: boolean }
        isSale: { type: boolean }
        isNew: { type: boolean }
        price: { type: [number, 'null'] }
    ProductDetails:
      type: object
      required: [id, name, productSlug, photo, scheme, stock, categoryName, categorySlug, quantityInPack, breadcrumbs, updatedAt]
      properties:
        id: { type: integer, description: 1C product code shown to customers as the article. }
        name: { type: string }
        productSlug: { type: string, description: Current slug; differs from the request when a former slug was used. }
        updatedAt: { type: string, format: date-time }
        photo: { type: string }
        scheme: { type: string }
        stock: { type: number }
        categoryName: { type: string }
        categorySlug: { type: string }
        quantityInPack: { type: integer }
        price: { type: [number, 'null'] }
        breadcrumbs: { type: array, items: { $ref: '#/components/schemas/Breadcrumb' } }
    Breadcrumb:
      type: object
      required: [id, name, slug]
      properties: { id: { type: integer }, name: { type: string }, slug: { type: string } }
    AdminProduct:
      type: object
      required: [id, nameUk, nameRu, productSlug, photo, categoryName, inStock, isSale, isNew, exportToSite, stock, quantityInPack]
      properties:
        id: { type: integer }
        nameUk: { type: string }
        nameRu: { type: string }
        productSlug: { type: string }
        photo: { type: string }
        categoryId: { type: [integer, 'null'] }
        categoryName: { type: string, description: Ukrainian short category name; empty when the reference is unavailable. }
        inStock: { type: boolean }
        isSale: { type: boolean }
        isNew: { type: boolean }
        exportToSite:
          type: boolean
          description: Whether the product is marked for export to the website by the 1C import.
        price: { type: [number, 'null'] }
        stock: { type: number }
        quantityInPack: { type: integer }
        isDeleted: { type: boolean }
        deletedAt: { type: [string, 'null'], format: date-time }
    MissingProductPhoto:
      allOf:
        - $ref: '#/components/schemas/AdminProduct'
        - type: object
          required: [photoAvailable, photoStatus, photoCheckedAtUtc, photoHttpStatusCode]
          properties:
            photoAvailable: { type: boolean, const: false }
            photoStatus: { type: string, enum: [Missing, InvalidContentType, CheckFailed] }
            photoCheckedAtUtc: { type: string, format: date-time }
            photoHttpStatusCode: { type: [integer, 'null'], minimum: 100, maximum: 599 }
    AdminProductDetails:
      type: object
      required: [id, nameUk, nameRu, productSlug, photo, scheme, categoryId, categoryName, inStock, isSale, isNew, exportToSite, price, stock, quantityInPack]
      properties:
        id: { type: integer }
        nameUk: { type: string }
        nameRu: { type: string }
        productSlug: { type: string }
        photo: { type: string }
        scheme: { type: string, description: Stored scheme URL; the API does not probe media availability. }
        categoryId: { type: integer }
        categoryName: { type: string }
        inStock: { type: boolean }
        isSale: { type: boolean }
        isNew: { type: boolean }
        exportToSite: { type: boolean }
        price: { type: [number, 'null'] }
        stock: { type: number }
        quantityInPack: { type: integer }

openapi: 3.1.0
info:
  title: KedrStore Catalog — catalog snapshot for the offline manager app
  version: 0.1.0
  description: >-
    The whole sales catalog in one answer (spec platform/004). The app replaces its local tables with it and asks
    again with `If-None-Match`; fields may be added later and the app ignores fields it does not know.
paths:
  /api/mobile/sync/catalog:
    get:
      operationId: getMobileCatalogSnapshot
      summary: Products, prices, categories and price types for offline work
      description: >-
        Requires `CanManageOrders` (Manager or Admin); the app sends its bearer token. Deleted products and categories
        are left out. Responses carry a strong `ETag` (the same value as `version`) and are gzip or Brotli compressed
        when the client accepts it.
      tags: [MobileSync]
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
          description: The `ETag` of the snapshot the app already holds.
      responses:
        '200':
          description: The snapshot.
          headers:
            ETag: { schema: { type: string }, description: Strong tag of the content. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogSnapshot' }
        '304': { description: The app already holds this version; no body. }
        '401': { description: Not signed in. }
        '403': { description: Not a Manager or Admin. }
components:
  schemas:
    CatalogSnapshot:
      type: object
      required: [version, generatedAt, retailPriceTypeId, priceTypes, categories, products]
      properties:
        version: { type: string, description: 'Hash of the content, equal to the ETag without quotes.' }
        generatedAt: { type: string, format: date-time, description: When the answer was built; not part of the version. }
        retailPriceTypeId: { type: integer, description: Price type used without a customer. }
        priceTypes:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer }
              name: { type: string }
        categories:
          type: array
          items:
            type: object
            required: [id, parentId, name, sortOrder]
            properties:
              id: { type: integer }
              parentId: { type: [integer, 'null'] }
              name: { type: string }
              sortOrder: { type: integer }
        products:
          type: array
          items: { $ref: '#/components/schemas/CatalogSnapshotProduct' }
    CatalogSnapshotProduct:
      type: object
      required: [id, slug, name, categoryId, stock, inStock, quantityInPack, isSale, isNew, photos, scheme, prices]
      properties:
        id: { type: integer, description: The 1C product code. }
        slug: { type: string }
        name: { type: string, description: 'Ukrainian name, or the 1C name without a translation.' }
        categoryId: { type: integer }
        stock: { type: number }
        inStock: { type: boolean, description: 'The sales catalog rule: hardware needs more than 2, other goods more than 0.' }
        quantityInPack: { type: integer }
        isSale: { type: boolean }
        isNew: { type: boolean }
        photos: { type: array, items: { type: string, format: uri }, description: Photo URLs; the first is the main one. }
        scheme: { type: [string, 'null'], format: uri }
        prices:
          type: array
          description: UAH amounts by price type, as the order workspace quotes them.
          items:
            type: object
            required: [priceTypeId, amount]
            properties:
              priceTypeId: { type: integer }
              amount: { type: number, minimum: 0 }
